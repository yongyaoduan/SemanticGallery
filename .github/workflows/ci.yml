name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode with Swift 6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare bundled artifacts
        run: ./scripts/prepare-bundled-artifacts.sh "$RUNNER_TEMP/semanticgallery-artifacts"

      - name: Run Swift tests
        env:
          SEMANTICGALLERY_UI_TEST_ARTIFACT_FIXTURE_ROOT: ${{ runner.temp }}/semanticgallery-artifacts
        run: swift test

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      - name: Run dmg packaging tests
        run: bash scripts/test-build-dmg.sh

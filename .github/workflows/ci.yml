name: CI

on:
  push:
  pull_request:

jobs:
  swift-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode with Swift 6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Swift tests
        run: swift test

      - name: Validate shell scripts
        run: bash -n scripts/*.sh

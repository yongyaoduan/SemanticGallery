name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  macos-desktop:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Run frontend tests
        working-directory: desktop
        run: npm test -- --runInBand

      - name: Run Rust tests
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APPLE_CERTIFICATE_P12"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          KEYCHAIN_PATH="$RUNNER_TEMP/semanticgallery-build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/semanticgallery-cert.p12"
          export CERT_PATH
          python - <<'PY'
from base64 import b64decode
from pathlib import Path
import os

Path(os.environ["CERT_PATH"]).write_bytes(b64decode(os.environ["APPLE_CERTIFICATE_P12"]))
PY
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" /Users/runner/Library/Keychains/login.keychain-db
          security default-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build signed desktop release artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: python scripts/build_desktop_release.py --require-developer-id --require-notarization

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: semanticgallery-macos-arm64
          path: dist/release/*

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/release/*

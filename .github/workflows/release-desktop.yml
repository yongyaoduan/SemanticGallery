name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
      - "*.*.*"

jobs:
  macos-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode with Swift 6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare bundled artifacts
        run: ./scripts/prepare-bundled-artifacts.sh "$RUNNER_TEMP/semanticgallery-artifacts"

      - name: Run Swift tests
        env:
          SEMANTICGALLERY_UI_TEST_ARTIFACT_FIXTURE_ROOT: ${{ runner.temp }}/semanticgallery-artifacts
        run: swift test

      - name: Build desktop dmg
        id: build_dmg
        env:
          SEMANTICGALLERY_BUNDLED_ARTIFACT_SOURCE_ROOT: ${{ runner.temp }}/semanticgallery-artifacts
        run: |
          log_path="$(mktemp)"
          ./scripts/build-dmg.sh | tee "$log_path"
          dmg_path="$(tail -n 1 "$log_path")"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: semanticgallery-macos-dmg
          path: ${{ steps.build_dmg.outputs.dmg_path }}

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: SemanticGallery ${{ github.ref_name }}
          body: |
            ## Highlights
            - Native Swift macOS desktop build with the current museum-style interface.
            - Local-first semantic search for one selected folder at a time.
            - Text search, pasted-image search, image preview, image-to-image search, selection mode, and delete-to-Trash.
            - Optional private album adaptation that retrains locally and rebuilds the search index.

            ## Install
            1. Download the dmg and drag `SemanticGallery.app` to `Applications`.
            2. Open `Applications`, right-click `SemanticGallery`, and choose `Open` on first launch.
            3. In Settings, choose the folder you want to search.
            4. Wait for indexing to finish, then return to the usage page and start searching.

            ## Behavior Notes
            - Search results only come from the folder that is currently selected in Settings.
            - If the same image exists in multiple folders, SemanticGallery stores one embedding and keeps multiple file paths.
            - Deleting from search results only moves the file in the current folder to Trash.
            - Indexing and private adaptation both run locally and can take time on first use.
            - This release is built for Apple Silicon Macs.
          files: ${{ steps.build_dmg.outputs.dmg_path }}

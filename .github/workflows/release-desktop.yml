name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  macos-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode with Swift 6
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare bundled artifacts
        run: ./scripts/prepare-bundled-artifacts.sh "$RUNNER_TEMP/semanticgallery-artifacts"

      - name: Run Swift tests
        run: swift test

      - name: Build desktop dmg
        id: build_dmg
        env:
          SEMANTICGALLERY_BUNDLED_ARTIFACT_SOURCE_ROOT: ${{ runner.temp }}/semanticgallery-artifacts
        run: |
          dmg_path="$(./scripts/build-dmg.sh)"
          echo "dmg_path=$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: semanticgallery-macos-dmg
          path: ${{ steps.build_dmg.outputs.dmg_path }}

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build_dmg.outputs.dmg_path }}
